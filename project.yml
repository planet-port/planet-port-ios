name: PlanetPort
options:
  bundleIdPrefix: com.zivyuan
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  PlanetPort:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.imgozi.i.PlanetPort
        # 无 AppIcon 资源（与建仓时一致）；仅有背景图 imageset。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 全局主色：三角配色 500(#D44037)/深色 200(#ff695b)。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    sources:
      - path: PlanetPort
      - path: Shared
    dependencies:
      - target: PlanetPortTunnel
        embed: true
        codeSign: true
    entitlements:
      path: PlanetPort/PlanetPort.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.imgozi.i.PlanetPort
        com.apple.developer.networking.networkextension:
          - dns-proxy
          - url-filter-provider
          - content-filter-provider
          - packet-tunnel-provider
          - relay
          - dns-settings
          - app-proxy-provider
    info:
      path: PlanetPort/Info.plist
      properties:
        CFBundleDisplayName: Planet Port
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 用于扫描二维码识别网络 ID 或导入行星文件地址
  PlanetPortTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PlanetPortTunnel
      - path: ZTBridge
      - path: Shared
      - path: Core
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.imgozi.i.PlanetPort.tunnel
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - ZT_NO_PEER_METRICS=1
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Core/include
          - $(SRCROOT)/Core/ext
          - $(SRCROOT)/Core/ext/prometheus-cpp-lite-1.0/core
          - $(SRCROOT)/Core/ext/prometheus-cpp-lite-1.0/simpleapi
        SWIFT_OBJC_BRIDGING_HEADER: ZTBridge/PlanetPortTunnel-Bridging-Header.h
        GCC_PRECOMPILE_PREFIX_HEADER: NO
    preBuildScripts:
      - name: 检查 ZeroTier 核心源码
        script: |
          if [[ ! -f "$SRCROOT/Core/.fetched-tag" ]]; then
            echo "error: 缺少 ZeroTier 核心源码（Core/ 不在仓库内，构建前需拉取）。请先在仓库根目录执行：./scripts/bootstrap.sh"
            exit 1
          fi
    entitlements:
      path: PlanetPortTunnel/PlanetPortTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.imgozi.i.PlanetPort
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: PlanetPortTunnel/Info.plist
      properties:
        CFBundleDisplayName: PlanetPortTunnel
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
schemes:
  PlanetPort:
    build:
      targets:
        PlanetPort: all
