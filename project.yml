name: PlanetPort
options:
  bundleIdPrefix: com.zivyuan
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  PlanetPort:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.imgozi.i.PlanetPort
        # 无 AppIcon 资源（与建仓时一致）；仅有背景图 imageset。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 全局主色：三角配色 500(#D44037)/深色 200(#ff695b)。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    sources:
      - path: PlanetPort
      - path: Shared
      - path: Modules/QRTransfer
    preBuildScripts:
      - name: 生成构建信息
        script: |
          GEN="$SRCROOT/PlanetPort/Generated/BuildInfo.swift"
          mkdir -p "$(dirname "$GEN")"
          h=$(git -C "$SRCROOT" rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then d=true; else d=false; fi
          now=$(date "+%Y-%m-%d %H:%M")
          printf '// 构建脚本自动生成，勿手改（project.yml preBuildScripts「生成构建信息」）。\nenum BuildInfo {\n    static let time = "%s"\n    static let hash = "%s"\n    static let dirty = %s\n}\n' "$now" "$h" "$d" > "$GEN"
    dependencies:
      - target: PlanetPortTunnel
        embed: true
        codeSign: true
    entitlements:
      path: PlanetPort/PlanetPort.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.imgozi.i.PlanetPort
        com.apple.developer.networking.networkextension:
          - dns-proxy
          - url-filter-provider
          - content-filter-provider
          - packet-tunnel-provider
          - relay
          - dns-settings
          - app-proxy-provider
    info:
      path: PlanetPort/Info.plist
      properties:
        CFBundleDisplayName: Planet Port
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 用于扫描二维码识别网络 ID 或导入行星文件地址
  PlanetPortTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PlanetPortTunnel
      - path: ZTBridge
      - path: Shared
      - path: Core
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.imgozi.i.PlanetPort.tunnel
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - ZT_NO_PEER_METRICS=1
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Core/include
          - $(SRCROOT)/Core/ext
          - $(SRCROOT)/Core/ext/prometheus-cpp-lite-1.0/core
          - $(SRCROOT)/Core/ext/prometheus-cpp-lite-1.0/simpleapi
        SWIFT_OBJC_BRIDGING_HEADER: ZTBridge/PlanetPortTunnel-Bridging-Header.h
        GCC_PRECOMPILE_PREFIX_HEADER: NO
    preBuildScripts:
      - name: 检查 ZeroTier 核心源码
        script: |
          want=$(sed -n 's/^ZT_VERSION=//p' "$SRCROOT/scripts/bootstrap.sh")
          got=$(cat "$SRCROOT/Core/.fetched-tag" 2>/dev/null)
          if [ "$got" != "$want" ]; then
            echo "error: 缺少 ZeroTier 核心源码或版本不匹配（需要 ${want}，当前 ${got:-无}）。请先在仓库根目录执行：./scripts/bootstrap.sh"
            exit 1
          fi
    entitlements:
      path: PlanetPortTunnel/PlanetPortTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cn.imgozi.i.PlanetPort
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: PlanetPortTunnel/Info.plist
      properties:
        CFBundleDisplayName: PlanetPortTunnel
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
  PlanetPortTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: Modules/QRTransfer/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PlanetPort
schemes:
  PlanetPort:
    build:
      targets:
        PlanetPort: all
    test:
      targets:
        - PlanetPortTests
