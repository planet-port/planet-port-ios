name: Release Build

# 可复用发布构建：tag 推送（release.yml）与网页发版（release-dispatch.yml）共用。
# 不设独立触发器，仅 workflow_call。
on:
  workflow_call:
    inputs:
      tag:
        description: 要构建发布的版本 tag（如 v1.4.0）
        required: true
        type: string

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # 手写 init 兼容 Swift 6.1/6.2：struct 含无默认值 private 存储属性时，两代
      # 编译器都会把 memberwise init 降级为 private；镜像默认 Xcode 16.4（Swift 6.1）编译不过
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 拉取 ZeroTier 核心并生成 Xcode 工程
        run: ./scripts/bootstrap.sh

      - name: 构建(无签名)
        run: |
          xcodebuild -scheme PlanetPort -configuration Release \
            -project PlanetPort.xcodeproj \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build

      - name: 打包未签名 IPA
        run: |
          TAG="${{ inputs.tag }}"
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PlanetPort.app Payload/
          zip -rq "PlanetPort-${TAG}.ipa" Payload
          ls -lh "PlanetPort-${TAG}.ipa"

      - name: 提取 CHANGELOG 对应版本段落作为发布说明
        run: |
          TAG="${{ inputs.tag }}"
          # 精确匹配 `（` 前的完整版本 token，避免 v1.4.0 前缀误中 v1.4.0-beta.1 段落
          awk -v tag="$TAG" '
            $1 == "##" {
              v = $2
              sub(/（.*/, "", v)
              if (v == tag) { insec = 1; next }
            }
            insec && $1 == "##" { exit }
            insec { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "错误：CHANGELOG.md 中未找到 $TAG 段落" >&2; exit 1; }

      - name: 创建 Release 并上传 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          # beta tag 以 prerelease 形式发布，不占用 /releases/latest
          FLAGS=()
          case "$TAG" in *-beta.*) FLAGS=(--prerelease) ;; esac
          gh release create "$TAG" \
            "PlanetPort-${TAG}.ipa" \
            --title "$TAG" \
            "${FLAGS[@]}" \
            --notes-file release-notes.md
