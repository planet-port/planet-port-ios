name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # 手写 init 兼容 Swift 6.1/6.2：struct 含无默认值 private 存储属性时，两代
      # 编译器都会把 memberwise init 降级为 private；镜像默认 Xcode 16.4（Swift 6.1）编译不过
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 拉取 ZeroTier 核心并生成 Xcode 工程
        run: ./scripts/bootstrap.sh

      - name: 构建(无签名)
        run: |
          xcodebuild -scheme PlanetPort -configuration Release \
            -project PlanetPort.xcodeproj \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build

      - name: 打包未签名 IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PlanetPort.app Payload/
          zip -rq "PlanetPort-${GITHUB_REF_NAME}.ipa" Payload
          ls -lh "PlanetPort-${GITHUB_REF_NAME}.ipa"

      - name: 提取 CHANGELOG 对应版本段落作为发布说明
        run: |
          # 精确匹配 `（` 前的完整版本 token，避免 v1.4.0 前缀误中 v1.4.0-beta.1 段落
          awk -v tag="$GITHUB_REF_NAME" '
            $1 == "##" {
              v = $2
              sub(/（.*/, "", v)
              if (v == tag) { insec = 1; next }
            }
            insec && $1 == "##" { exit }
            insec { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "错误：CHANGELOG.md 中未找到 $GITHUB_REF_NAME 段落" >&2; exit 1; }

      - name: 创建 Release 并上传 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # beta tag 以 prerelease 形式发布，不占用 /releases/latest
          FLAGS=()
          case "$GITHUB_REF_NAME" in *-beta.*) FLAGS=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "PlanetPort-${GITHUB_REF_NAME}.ipa" \
            --title "$GITHUB_REF_NAME" \
            "${FLAGS[@]}" \
            --notes-file release-notes.md
