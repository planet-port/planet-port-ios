name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    # 推送 v* tag 时构建 IPA 并创建 GitHub Release
    # （构建逻辑在可复用工作流，与网页发版 release-dispatch.yml 共用）
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
